name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. No secrets are used, so pull requests from forks get nothing.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      # Engine rules plus app-side security tests (error text, deep links, session storage, food requests, analytics).
      - run: npm test
      # Database: every migration, the security suite on an in-memory Postgres, then 15 deliberately weakened
      # controls that the suite must catch.
      - run: npm run test:db
      # Production bundle builds, and neither the repo, its history nor the bundle holds a secret.
      - run: npx expo export --platform android --output-dir dist
      - run: npm run scan:secrets -- --history dist
      - run: npm audit --omit=dev --audit-level=critical

  food-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The repo root has a package.json; use Deno's own npm cache instead of an (uninstalled) node_modules.
      - run: deno check --node-modules-dir=none supabase/functions/food/index.ts
