name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test
      # Database security tests: migrations + RLS/abuse checks on an in-memory Postgres.
      - run: npm run test:db
      - run: npm audit --omit=dev --audit-level=critical

  food-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The repo root has a package.json; use Deno's own npm cache instead of an (uninstalled) node_modules.
      - run: deno check --node-modules-dir=none supabase/functions/food/index.ts
